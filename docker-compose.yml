services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LIKEC4_API_DEBUG=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
